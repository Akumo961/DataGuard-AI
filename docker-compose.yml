services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataguard}
      POSTGRES_USER: ${POSTGRES_USER:-dataguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATAGUARD_ENVIRONMENT: ${DATAGUARD_ENVIRONMENT:-development}
      DATAGUARD_DATABASE_URL: ${DATAGUARD_DATABASE_URL:-postgresql+psycopg://dataguard:${POSTGRES_PASSWORD}@postgres:5432/dataguard}
      DATAGUARD_REDIS_URL: ${DATAGUARD_REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATAGUARD_JWT_SECRET: ${DATAGUARD_JWT_SECRET:?set DATAGUARD_JWT_SECRET}
      DATAGUARD_OCR_ENABLED: ${DATAGUARD_OCR_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
    ports:
      - "${DATAGUARD_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
