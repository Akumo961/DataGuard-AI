[project]
name = "dataguard-quebec"
version = "0.3.0"
description = "DataGuard Québec - privacy, personal-information discovery and risk platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "python-multipart>=0.0.20,<1",
  "structlog>=25,<26",
  "PyJWT[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.12,<1", "mypy>=1.17,<2", "httpx>=0.28,<1"]
ocr = ["pytesseract>=0.3.13,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["dataguard/tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = [
  "dataguard",
  "dataguard.*",
  "compliance",
  "compliance.*",
  "DataGuardAI",
  "DataGuardAI.*",
]
exclude = [
  "demo",
  "demo.*",
  "alembic",
  "alembic.*",
]
