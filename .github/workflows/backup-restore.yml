name: DataGuard Backup Restore

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: dataguard-ci-password
      SECRET_KEY: ci-secret-key-with-more-than-32-characters
      DATAGUARD_JWT_SECRET: ci-jwt-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Start database
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U dataguard -d dataguard && exit 0
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - name: Run migrations
        run: docker compose run --build --rm api alembic upgrade head
      - name: Seed restoration evidence
        run: |
          docker compose exec -T postgres psql -U dataguard -d dataguard <<'SQL'
          INSERT INTO organizations (id, slug, name, active, classification_policy)
          VALUES (
            '00000000-0000-0000-0000-000000000042',
            'backup-check',
            'Backup Check',
            true,
            '{"public_max":[],"internal_max":["ORGANIZATION"],"confidential_max":["PERSON","EMAIL","PHONE","ADDRESS","IP_ADDRESS","EMPLOYEE_ID","CUSTOMER_ID"],"restricted_max":["DATE_OF_BIRTH","GOVERNMENT_ID","PASSPORT","DRIVER_LICENSE","TAX_ID","FINANCIAL_INFORMATION","BANK_ACCOUNT","HEALTH_INFORMATION","LOCATION","OTHER_SENSITIVE_INFORMATION"],"highly_restricted_max":["CREDIT_CARD","SOCIAL_INSURANCE_NUMBER","HEALTH_INSURANCE_ID","BIOMETRIC_DATA"]}'::jsonb
          )
          ON CONFLICT (id) DO NOTHING;
          SQL
      - name: Exercise backup and restore
        run: bash scripts/backup_restore_check.sh
      - name: Cleanup
        if: always()
        run: docker compose down -v
