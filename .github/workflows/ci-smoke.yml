name: DataGuard CI Smoke

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate project metadata
        run: python -c 'import tomllib; tomllib.load(open("pyproject.toml", "rb"))'
      - name: Verify Python formatting
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.16.5"
          python -m ruff format --check dataguard
      - name: Verify runner and repository
        run: |
          set -euo pipefail
          python3 --version
          test -f pyproject.toml
          python3 -m compileall -q dataguard
