name: DataGuard Kubernetes Validation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests offline
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find deploy/kubernetes -maxdepth 1 -type f -name '*.yaml' -print | sort)
          test "${#manifests[@]}" -gt 0
          args=()
          for manifest in "${manifests[@]}"; do
            args+=("/work/${manifest}")
          done
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary "${args[@]}"
      - name: Validate rollout and rollback metadata
        run: |
          test "$(grep -c 'revisionHistoryLimit:' deploy/kubernetes/api-deployment.yaml)" -ge 1
          test "$(grep -c 'type: RollingUpdate' deploy/kubernetes/api-deployment.yaml)" -ge 1
          test "$(grep -c 'strategy:' deploy/kubernetes/api-deployment.yaml)" -ge 1
