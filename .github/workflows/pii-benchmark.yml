name: DataGuard PII Benchmark

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detector dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Evaluate synthetic corpus
        run: python benchmarks/evaluate_pii.py
