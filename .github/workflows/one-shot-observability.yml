name: DataGuard one-shot observability integration

on:
  push:
    branches: ["hardening/bank-grade-platform"]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor == 'Akumo961'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/bank-grade-platform
      - name: Integrate metrics middleware
        shell: python
        run: |
          from pathlib import Path
          p = Path("dataguard/api/app.py")
          s = p.read_text()
          if "from dataguard.observability.metrics import MetricsMiddleware, metrics_response" not in s:
              s = s.replace(
                  "from dataguard.api.schemas import (\n",
                  "from dataguard.observability.metrics import MetricsMiddleware, metrics_response\n"
                  "from dataguard.api.schemas import (\n", 1)
          s = s.replace("    app.add_middleware(SecurityHeadersMiddleware)\n", "    app.add_middleware(SecurityHeadersMiddleware)\n    app.add_middleware(MetricsMiddleware)\n", 1)
          marker = '    @app.get("/health/live")'
          route = '    @app.get("/metrics", include_in_schema=False)\n    async def metrics():\n        return metrics_response()\n\n'
          if 'async def metrics()' not in s:
              if marker in s:
                  s = s.replace(marker, route + marker, 1)
              else:
                  raise SystemExit("health route marker not found")
          p.write_text(s)
          Path(".github/workflows/one-shot-observability.yml").unlink()
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataguard/api/app.py .github/workflows/one-shot-observability.yml
          git commit -m "feat: instrument HTTP metrics"
          git push origin HEAD:hardening/bank-grade-platform
