name: DataGuard one-shot import fix

on:
  push:
    branches: ["hardening/bank-grade-platform"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'Akumo961'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/bank-grade-platform
      - name: Fix auth import
        shell: python
        run: |
          from pathlib import Path
          p = Path("dataguard/api/auth_routes.py")
          s = p.read_text()
          s = s.replace("from fastapi import APIRouter, Depends, HTTPException, Request, status\n", "from fastapi import APIRouter, Depends, HTTPException, Request, status\nfrom jwt import InvalidTokenError\n", 1)
          p.write_text(s)
          Path(".github/workflows/one-shot-import-fix.yml").unlink()
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataguard/api/auth_routes.py .github/workflows/one-shot-import-fix.yml
          git commit -m "fix: import OIDC token validation error"
          git push origin HEAD:hardening/bank-grade-platform
