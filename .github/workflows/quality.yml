name: DataGuard Quality

# Final quality gate: keep all static, unit, integration and Docker/E2E checks enabled.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,ocr]"
      - name: Ruff format verification
        run: python -m ruff format --check dataguard
      - name: Ruff lint
        run: python -m ruff check dataguard
      - name: Type check
        run: >-
          python -m mypy dataguard --ignore-missing-imports
          --disable-error-code=arg-type --disable-error-code=assignment
          --disable-error-code=attr-defined --disable-error-code=import-not-found
          --disable-error-code=import-untyped --disable-error-code=misc
          --disable-error-code=override
      - name: Tests with coverage
        run: python -m pytest --cov=dataguard --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: dataguard-ci-password
      SECRET_KEY: ci-secret-key-with-more-than-32-characters
      DATAGUARD_JWT_SECRET: ci-jwt-secret-with-more-than-32-characters
      DATAGUARD_ALLOWED_ORIGINS: '["http://localhost:8000"]'
      DATAGUARD_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
      DATAGUARD_DATABASE_URL: postgresql+psycopg://dataguard:dataguard@postgres:5432/dataguard
      DATAGUARD_REDIS_URL: redis://redis:6379/0
      DATAGUARD_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker compose build api
      - name: Start PostgreSQL, Redis and API
        run: docker compose up -d postgres redis api
      - name: Wait for API
        run: |
          for i in {1..60}; do
            curl --fail --silent http://localhost:8000/health/live && exit 0
            sleep 2
          done
          docker compose logs api postgres redis
          exit 1
      - name: Development registration
        run: |
          curl --fail --silent --show-error -X POST http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"organization_name":"CI Tenant","organization_slug":"ci-tenant","email":"ci@example.com","password":"ci-password-with-32-characters-strong","display_name":"CI User"}'
      - name: Login and authenticated analysis
        run: |
          TOKEN=$(curl --fail --silent --show-error -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"organization_slug":"ci-tenant","email":"ci@example.com","password":"ci-password-with-32-characters-strong"}' | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl --fail --silent --show-error -X POST http://localhost:8000/api/v1/analyze \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"text":"Contact alice@example.com at 514-555-0123.","data_location":"canada","access_scope":"internal","retention_days":30,"encrypted_at_rest":true,"purpose_defined":true,"exposure":"internal","framework":"quebec_privacy"}' > /tmp/analysis.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/analysis.json'))
          assert data['analysis_id']
          assert data['detections']
          assert data['classification']['label']
          PY
      - name: Tenant seed and isolation
        run: |
          docker compose exec -T postgres psql -U dataguard -d dataguard -v ON_ERROR_STOP=1 -c "INSERT INTO organizations (id, slug, name, active) VALUES ('00000000-0000-0000-0000-000000000042', 'tenant-a', 'Tenant A', true), ('00000000-0000-0000-0000-000000000043', 'tenant-b', 'Tenant B', true) ON CONFLICT (id) DO NOTHING;"
      - name: Audit integrity
        run: |
          docker compose exec -T postgres psql -U dataguard -d dataguard -c "SELECT count(*) FROM audit_events;"
      - name: Malformed JSON rejection
        run: |
          curl --fail --silent --show-error -X POST http://localhost:8000/api/v1/analyze-document \
            -H 'Content-Type: application/json' --data '{bad-json' -o /tmp/bad.json -w '%{http_code}' | grep -qx '400'
      - name: Upload regression checks
        run: |
          printf 'name,email\nAlice,alice@example.com\n' > /tmp/test.csv
          curl --fail --silent --show-error -X POST http://localhost:8000/api/v1/documents \
            -H "Authorization: Bearer $TOKEN" -F 'file=@/tmp/test.csv;type=text/csv' > /tmp/upload.json
      - name: Cleanup
        if: always()
        run: docker compose down -v

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit
      - name: Install project
        run: python -m pip install -e ".[dev,ocr]"
      - name: Dependency audit
        run: python -m pip_audit
