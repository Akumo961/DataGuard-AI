name: DataGuard Quality

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,ocr]"
      - name: Ruff format verification
        run: python -m ruff format --check dataguard
      - name: Ruff lint
        run: python -m ruff check dataguard
      - name: Type check
        run: python -m mypy dataguard --ignore-missing-imports --disable-error-code=arg-type --disable-error-code=assignment --disable-error-code=attr-defined --disable-error-code=import-not-found --disable-error-code=import-untyped --disable-error-code=misc --disable-error-code=override
      - name: Tests with coverage
        run: python -m pytest --cov=dataguard --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit "setuptools>=83.0.0"
      - name: Audit declared dependencies
        run: python -m pip install -e . && python -m pip_audit

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: dataguard-ci-password
      SECRET_KEY: ci-secret-key-with-more-than-32-characters
      DATAGUARD_JWT_SECRET: ci-jwt-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL, Redis and API
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Verify configured multilingual NER model is installed
        run: docker compose exec -T api python -c 'import spacy; nlp=spacy.load("xx_ent_wiki_sm"); assert "ner" in nlp.pipe_names; print(nlp.meta["name"], nlp.meta["version"])'
      - name: Verify development-only registration and login
        run: |
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/auth/register -H 'Content-Type: application/json' -d '{"organization_name":"CI Local Auth","organization_slug":"ci-local-auth","email":"dev@example.invalid","password":"local-development-password","display_name":"CI Developer"}' | tee /tmp/register.json
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/auth/login -H 'Content-Type: application/json' -d '{"organization_slug":"ci-local-auth","email":"dev@example.invalid","password":"local-development-password"}' | tee /tmp/login.json
          grep -q '"token_type":"bearer"' /tmp/login.json
          test -s /tmp/login.json
          test -n "$(python -c 'import json; print(json.load(open("/tmp/login.json"))["access_token"])')"
      - name: Seed isolated CI tenants and users
        run: |
          docker compose exec -T postgres psql -U dataguard -d dataguard -v ON_ERROR_STOP=1 -c "INSERT INTO organizations (id, slug, name, active) VALUES ('00000000-0000-0000-0000-000000000042', 'ci-tenant-a', 'CI Tenant A', true), ('00000000-0000-0000-0000-000000000043', 'ci-tenant-b', 'CI Tenant B', true) ON CONFLICT (id) DO NOTHING;"
          docker compose exec -T api python -c 'from sqlalchemy import create_engine,text; import os,uuid; from dataguard.security.passwords import hash_password; engine=create_engine(os.environ["DATAGUARD_DATABASE_URL"].replace("+asyncpg","")); conn=engine.connect(); conn.execute(text("INSERT INTO users (id, organization_id, email, password_hash, display_name, active, failed_login_count) VALUES (:id,:org,:email,:pw,:name,true,0) ON CONFLICT DO NOTHING"), {"id":str(uuid.uuid4()),"org":"00000000-0000-0000-0000-000000000042","email":"ci-a@example.invalid","pw":hash_password("not-used-password"),"name":"CI A"}); conn.commit(); conn.close()'
      - name: Exercise authenticated tenant workflow
        run: |
          TOKEN=$(docker compose exec -T api python -c 'import jwt; from datetime import datetime,timedelta,timezone; n=datetime.now(timezone.utc); print(jwt.encode({"sub":"00000000-0000-0000-0000-000000000001","org":"00000000-0000-0000-0000-000000000042","roles":["analyst"],"iat":n,"exp":n+timedelta(minutes=5)}, "ci-jwt-secret-with-more-than-32-characters", algorithm="HS256"))')
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/analyze -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' -d '{"text":"Email alice@example.com","purpose_defined":true,"encrypted_at_rest":true,"access_scope":"internal","data_location":"quebec"}' | tee /tmp/analysis.json
          grep -q '"organization_id":"00000000-0000-0000-0000-000000000042"' /tmp/analysis.json
          test -s /tmp/analysis.json
          test "$(python -c 'import json; print(json.load(open("/tmp/analysis.json"))["analysis_id"])')" != "None"
          grep -q '"classification"' /tmp/analysis.json
      - name: Verify tenant isolation
        run: |
          TOKEN=$(docker compose exec -T api python -c 'import jwt; from datetime import datetime,timedelta,timezone; n=datetime.now(timezone.utc); print(jwt.encode({"sub":"00000000-0000-0000-0000-000000000002","org":"00000000-0000-0000-0000-000000000043","roles":["analyst"],"iat":n,"exp":n+timedelta(minutes=5)}, "ci-jwt-secret-with-more-than-32-characters", algorithm="HS256"))')
          ID=$(python -c 'import json; print(json.load(open("/tmp/analysis.json"))["analysis_id"])')
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:8000/api/v1/analyses/${ID})" = "404"
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
