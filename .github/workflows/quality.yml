name: DataGuard Quality

on:
  push:
    branches: [main, "production/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff format check
        run: python -m ruff format --check dataguard
      - name: Ruff lint
        run: python -m ruff check dataguard
      - name: Type check
        run: python -m mypy dataguard
      - name: Tests with coverage
        run: python -m pytest --cov=dataguard --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit "setuptools>=83.0.0"
      - name: Audit declared dependencies
        run: python -m pip install -e . && python -m pip_audit
