name: Quality

on:
  push:
    branches: [main, "production/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check dataguard
      - name: Type check
        run: mypy dataguard
      - name: Tests
        run: pytest --cov=dataguard --cov-report=term-missing
