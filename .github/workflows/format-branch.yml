name: Format hardening branch

on:
  push:
    branches:
      - hardening/bank-grade-platform

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/bank-grade-platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatter
        run: python -m pip install --disable-pip-version-check "ruff==0.16.5"
      - name: Format Python sources
        run: python -m ruff format dataguard
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git add dataguard
          git commit -m "style: apply Ruff formatting [skip ci]"
          git push origin HEAD:hardening/bank-grade-platform
