name: Format hardening branch

on:
  push:
    branches:
      - hardening/bank-grade-platform

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatter
        run: python -m pip install --disable-pip-version-check "ruff==0.16.5"
      - name: Verify Python formatting
        run: python -m ruff format --check dataguard
