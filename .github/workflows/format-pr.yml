name: DataGuard Format Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hardening/bank-grade-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/bank-grade-platform
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.5"
      - name: Format
        run: python -m ruff format dataguard
      - name: Commit and push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git add dataguard
          git commit -m "style: apply Ruff formatting [skip ci]"
          git push origin HEAD:hardening/bank-grade-platform
